name: Fork release-please

# The fork's own release line, <upstream>-beads.<n>. It uses fork-only config,
# manifest and changelog files, so upstream's release files never conflict;
# upstream's release-please.yml stays disabled on the fork. Upstream owns the
# npm name, so a created release gets the tested `npm pack` tarball attached
# for installs by URL instead of an npm publish.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.fork.json
          manifest-file: .release-please-manifest.fork.json

  # Build and test run read-only; only the upload job gets write access.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          # @beads/bd's postinstall skips the binary download when CI is set.
          env -u CI npm install -g --allow-scripts=@beads/bd @beads/bd@1.3.4
          echo "REQUIRE_BD=1" >> "$GITHUB_ENV"
          echo "BD_DISABLE_METRICS=1" >> "$GITHUB_ENV"
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build:skill -- --check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: tasks-axi-*.tgz
          if-no-files-found: error

  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      # A fixed-name copy plus the "latest" flag give installs one stable URL,
      # releases/latest/download/tasks-axi.tgz. release-please's prerelease
      # setting (needed for the -beads.<n> suffix) would otherwise mark the
      # release as a prerelease, which GitHub's latest link skips.
      - run: |
          cp tasks-axi-*.tgz tasks-axi.tgz
          gh release upload "$TAG" tasks-axi-*.tgz tasks-axi.tgz --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
